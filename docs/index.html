<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No frames, no forms, no plugins, https only. The TV app additionally only lets this page,
     the player library, poster images, and the stream hosts it checked itself connect. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src 'self' https:; media-src https: blob:; img-src https:; worker-src blob:; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<title>Video TV</title>
<style>
  html { font-size: clamp(14px, 1.5vw, 28px); }
  html, body { margin: 0; height: 100%; background: #000; color: #e8ebef; font-family: system-ui, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .hide { display: none !important; }
  #info { position: fixed; left: 0; right: 0; bottom: 0; padding: 3rem 4rem 2.5rem;
          background: linear-gradient(transparent, rgba(0,0,0,.85)); transition: opacity .6s; }
  #info.fade { opacity: 0; }
  #title { font-size: 2rem; font-weight: 700; margin: 0 0 .5rem; }
  #desc { font-size: 1.2rem; opacity: .85; margin: 0 0 .75rem; max-width: 70ch; }
  #meta { font-size: 1rem; opacity: .6; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; text-align: center; padding: 2rem; }

  .overlay { position: fixed; inset: 0; background: rgba(13,15,18,.97); overflow: hidden; }
  /* search */
  #search { padding: 2.5rem 0; }
  #search .col { width: 90vw; margin: 0 auto; }
  #search .col > * { max-width: 62vw; }
  #search h1 { font-size: 1.4rem; margin: 0 0 1rem; color: #9aa4b1; font-weight: 600; }
  #search h1 b { background: #f5c518; color: #000; padding: 0 .4rem; border-radius: .2rem; margin-right: .4rem; }
  #q { width: 100%; box-sizing: border-box; font-size: 1.5rem; padding: .8rem 1.2rem; border-radius: .8rem;
       border: 2px solid #2a313b; background: #161a20; color: #fff; outline: none; }
  #q:focus { border-color: #f5c518; }
  #results { list-style: none; margin: 1rem 0 0; padding: 0; }
  #results li { display: flex; gap: 1rem; align-items: center; padding: .45rem .8rem; border-radius: .6rem;
                border: 2px solid transparent; outline: none; }
  #results li:focus { background: #1d222a; border-color: #f5c518; }
  #results img, #results .ph { width: 2.6rem; height: 3.9rem; object-fit: cover; border-radius: .25rem; background: #1d222a; flex: none; }
  #results .t { font-size: 1.15rem; font-weight: 600; }
  #results .m { font-size: .9rem; color: #9aa4b1; }
  #hint { color: #9aa4b1; font-size: .9rem; margin-top: 1rem; }
  /* home: rows under the search box (only while the box is empty) */
  #search { overflow-y: auto; scrollbar-width: none; }
  #search::-webkit-scrollbar { display: none; }
  #home { width: 90vw; margin: 1.6rem auto 0; }
  #home .rowt { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: #9aa4b1; margin: 1.4rem 0 .6rem; }
  #home .row { display: flex; gap: .9rem; overflow: hidden; padding: .35rem; margin: 0 -.35rem; }
  .card { flex: none; width: 8.6vw; outline: none; border-radius: .55rem; position: relative; }
  .card .pimg { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: .55rem; background: #1d222a;
                border: 3px solid transparent; box-sizing: border-box; display: block; }
  .card:focus .pimg { border-color: #f5c518; }
  .card .ct { font-size: .8rem; color: #9aa4b1; margin-top: .35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card:focus .ct { color: #fff; }
  .card .badge { position: absolute; left: .4rem; top: .4rem; background: #f5c518; color: #000; font-weight: 700;
                 font-size: .75rem; padding: .05rem .45rem; border-radius: .3rem; }
  .chips { flex-wrap: wrap; }
  /* the chosen genre: a grid that goes down the page, most popular first */
  #home .row.genre { flex-wrap: wrap; overflow: visible; row-gap: 1.3rem; padding-bottom: 2rem; }
  .chip { flex: none; background: #161a20; border: 2px solid #2a313b; border-radius: 999px; padding: .35rem 1rem;
          font-size: .95rem; outline: none; color: #c9d0d8; }
  .chip.on { border-color: #555e6b; color: #fff; background: #1d222a; }
  .chip:focus { border-color: #f5c518; color: #fff; }
  #home .empty { color: #555e6b; font-size: .9rem; padding: 1rem 0; }
  #epmark { color: #f5c518; font-size: .9rem; font-weight: 600; white-space: nowrap; }
  #epmark.seen { color: #7fd18b; }
  /* details */
  #detail { display: grid; grid-template-columns: 22vw 1fr; gap: 2.5rem; padding: 3rem 4rem; box-sizing: border-box;
            overflow-y: auto; scrollbar-width: none; align-items: start; }
  #detail::-webkit-scrollbar { display: none; }
  #poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: .8rem; background: #161a20; }
  #dbody { min-width: 0; padding-bottom: 3rem; }
  #dsub { color: #9aa4b1; font-size: .95rem; margin: -.4rem 0 1rem; }
  #epinfo { max-width: 70ch; margin: -.2rem 0 1.2rem; }
  #epinfo .eh { font-weight: 600; font-size: 1rem; }
  #epinfo .em { color: #9aa4b1; font-size: .85rem; margin: .15rem 0 .35rem; }
  #epinfo .es { color: #c9d0d8; font-size: .95rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 4;
                -webkit-box-orient: vertical; overflow: hidden; }
  .drow { display: flex; gap: .9rem; overflow: hidden; padding: .35rem; margin: 0 -.35rem 1.2rem; }
  .person { flex: none; width: 7.2rem; outline: none; text-align: center; }
  .person .pp { width: 6.4rem; height: 6.4rem; border-radius: 50%; object-fit: cover; object-position: 50% 20%;
                background: #1d222a; border: 3px solid transparent; display: block; margin: 0 auto .45rem; box-sizing: border-box; }
  .person:focus .pp { border-color: #f5c518; }
  .person .n { font-size: .85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person .c { font-size: .75rem; color: #9aa4b1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person:focus .n { color: #fff; }
  .drow .card { width: 8vw; }
  #dtitle { font-size: 2.2rem; margin: 0; line-height: 1.15; }
  #dmeta { color: #9aa4b1; margin: .5rem 0 1rem; display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: center; font-size: 1rem; }
  #dmeta .id { font-family: ui-monospace, Menlo, monospace; background: #1d222a; border: 1px solid #2a313b; border-radius: .3rem; padding: 0 .5rem; color: #e8ebef; }
  #dmeta .rating { color: #f5c518; font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  .pill { background: #1d222a; border: 1px solid #2a313b; border-radius: 999px; padding: .2rem .8rem; font-size: .9rem; }
  .pill.tv { border-color: #f5c518; color: #f5c518; }
  #dplot { font-size: 1.1rem; line-height: 1.5; margin: 0 0 1.2rem; max-width: 70ch;
           display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  #epick { display: flex; flex-direction: column; align-items: flex-start; gap: .8rem; margin-bottom: 1.2rem; }
  .sel { display: flex; align-items: center; gap: .6rem; background: #161a20; border: 3px solid #2a313b;
         border-radius: .7rem; padding: .5rem 1rem; outline: none; font-size: 1.15rem; min-width: 9rem; }
  .sel:focus { border-color: #f5c518; }
  #favBtn { display: inline-flex; margin-bottom: .8rem; font-size: 1.05rem; }
  #favBtn .star { font-size: 1.3rem; color: #9aa4b1; }
  #favBtn.on .star { color: #f5c518; }
  #results li.head { color: #f5c518; font-weight: 700; padding: .2rem .8rem; border: 0; }
  #results .fav { color: #f5c518; }
  .sel .lbl { color: #9aa4b1; font-size: .9rem; }
  .sel .val { font-weight: 700; min-width: 1.6rem; text-align: center; }
  .sel .arr { color: #555e6b; }
  .sel:focus .arr { color: #f5c518; }
  #eptitle { color: #9aa4b1; font-size: .95rem; max-width: 22rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #openBtn { font-size: 1.3rem; font-weight: 700; padding: .7rem 2.2rem; border-radius: .7rem; border: 3px solid transparent;
             background: #f5c518; color: #000; outline: none; margin-bottom: 1.5rem; }
  #openBtn:focus { border-color: #fff; box-shadow: 0 0 0 .3rem rgba(245,197,24,.35); }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: #9aa4b1; margin: 0 0 .6rem; }
  /* loading / buffering */
  #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; text-align: center; }
  #ltitle { font-size: 1.8rem; font-weight: 700; }
  #lstatus { font-size: 1.2rem; color: #9aa4b1; }
  #lpct { font-size: 3.5rem; font-weight: 800; color: #f5c518; font-variant-numeric: tabular-nums; }
  #lbar { width: 40vw; height: .6rem; background: #1d222a; border-radius: 1rem; overflow: hidden; }
  #lfill { height: 100%; width: 0; background: #f5c518; transition: width .25s; }
  #lhint { font-size: .9rem; color: #9aa4b1; }
</style>
</head>
<body>
<video id="v" playsinline></video>
<div id="msg">Loading…</div>
<div id="info" class="fade"><p id="title"></p><p id="desc"></p><div id="meta"></div></div>

<div id="search" class="overlay hide"><div class="col">
  <input id="q" type="search" placeholder="Search movies & TV shows" maxlength="100" autocomplete="off">
  <ul id="results"></ul>
  <div id="hint">▼ to pick a result · OK to open · Back to close</div>
</div><div id="home"></div></div>

<div id="detail" class="overlay hide">
  <img id="poster" alt="">
  <div id="dbody">
    <h2 id="dtitle"></h2>
    <div id="dmeta"></div>
    <div id="dpills" class="pills"></div>
    <p id="dplot"></p>
    <div id="dsub"></div>
    <div class="sel" id="favBtn" tabindex="0"><span class="star">☆</span><span class="ftxt">Add to favorites</span></div>
    <div id="epick" class="hide">
      <div class="sel" id="selSeason" tabindex="0"><span class="lbl">Season</span><span class="arr">◀</span><span class="val" id="vSeason">1</span><span class="arr">▶</span></div>
      <div class="sel" id="selEpisode" tabindex="0"><span class="lbl">Episode</span><span class="arr">◀</span><span class="val" id="vEpisode">1</span><span class="arr">▶</span><span id="epmark"></span><span id="eptitle"></span></div>
    </div>
    <div id="epinfo" class="hide"><div class="eh"></div><div class="em"></div><div class="es"></div></div>
    <button id="openBtn">▶ Open</button>
    <div id="dcastwrap"><h3>Cast</h3><div id="cast" class="drow"></div></div>
    <div id="dmorewrap"><h3>More like this</h3><div id="more" class="drow"></div></div>
  </div>
</div>

<div id="loader" class="overlay hide">
  <div id="ltitle"></div>
  <div id="lstatus"></div>
  <div id="lpct"></div>
  <div id="lbar"><div id="lfill"></div></div>
  <div id="lhint">Back to cancel</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.4/dist/hls.min.js"
        integrity="sha384-p9vgU/7IYJWd3I4STrtqxqR/2cAQlhIX7D/HrTnIMEjjcUox165b7se7sxmm3zDg"
        crossorigin="anonymous"></script>
<script>
// Popup / new-site blocking: nothing on this page may open windows or leave the page.
window.open = () => null;
window.alert = window.confirm = window.prompt = () => {};
document.addEventListener('click', e => { if (e.target.closest('a')) e.preventDefault(); }, true);
</script>
<script>
const $ = id => document.getElementById(id);
const video = $('v'), info = $('info'), msg = $('msg');
const searchEl = $('search'), q = $('q'), resultsEl = $('results');
const detailEl = $('detail'), loaderEl = $('loader');
const BUFFER_SECONDS = 30;   // how much video to load before playback starts (bigger = smoother)

let screen = 'player';      // player | search | detail | loader
let videos = [], index = 0, hls = null, hideTimer = null;
let results = [], current = null, opened = null;   // current = title on the detail screen
let searchToken = 0, openToken = 0, bufferTimer = null, searchTimer = null;
let pick = { season: 1, episode: 1, episodes: null, token: 0 };   // TV shows: chosen season/episode

// ---------- helpers ----------
const img = (url, w) => /^https:\/\/m\.media-amazon\.com\//.test(url || '') ? url.replace(/\._V1_.*\.jpg$/, `._V1_UX${w}_.jpg`)
  : /^https:\/\/static\.tvmaze\.com\//.test(url || '') ? url
  : (url || '').startsWith('https://commons.wikimedia.org/wiki/Special:FilePath/') ? url.split('?')[0] + '?width=' + Math.min(400, w * 2) : '';
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function show(name) {
  screen = name;
  searchEl.classList.toggle('hide', name !== 'search');
  detailEl.classList.toggle('hide', name !== 'detail');
  loaderEl.classList.toggle('hide', name !== 'loader');
  if (name !== 'player') msg.style.display = 'none';
}
function safeVideos(d) {
  // Only https links on hosts the TV app checked and approved (the app enforces this too).
  const allowed = new Set(d.allowedHosts || []);
  return (d.videos || []).filter(v => {
    try { const u = new URL(v.src); return u.protocol === 'https:' && allowed.has(u.hostname); }
    catch (e) { return false; }
  });
}
// Everything runs on the TV. The app shell answers two same-origin URLs:
//   api/fetch?url=..&post=..  JSON from IMDb (approved data hosts only)
//   api/open?url=..           opens the video site hidden + sandboxed, returns its stream
let cfg = null;
// Lenient JSON: allows // and /* */ comments, trailing commas, curly quotes, missing { }.
function parseSettings(text) {
  text = text.replace(/[\u201C\u201D]/g, '"').replace(/^\uFEFF/, '');
  let out = '', str = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], nx = text[i + 1];
    if (str) { out += ch; if (ch === '\\' && nx !== undefined) { out += nx; i++; } else if (ch === '"') str = false; }
    else if (ch === '"') { str = true; out += ch; }
    else if (ch === '/' && nx === '/') { while (i < text.length && text[i] !== '\n') i++; out += '\n'; }
    else if (ch === '/' && nx === '*') { const e = text.indexOf('*/', i + 2); i = e < 0 ? text.length : e + 1; }
    else out += ch;
  }
  let t = out.trim().replace(/,\s*([}\]])/g, '$1').replace(/,\s*$/, '');
  if (!t.startsWith('{')) t = '{' + t + '}';
  return JSON.parse(t);
}
async function config() {
  // Your settings: config-noclaude.json. config.json (the example) is used only if that file
  // doesn't exist; a mistake in it is shown, never silently replaced by the example.
  if (cfg) return cfg;
  const get = name => fetch(name + '?t=' + Date.now(), { cache: 'no-store' });
  let r = await get('config-noclaude.json').catch(() => null);
  if (!r) throw new Error('Your settings (config-noclaude.json) couldn\'t be downloaded.');
  if (r.status === 404) r = await get('config.json');
  else if (!r.ok) throw new Error(`Your settings (config-noclaude.json) couldn't be downloaded (HTTP ${r.status}).`);
  let c;
  try { c = parseSettings(await r.text()); }
  catch (e) { throw new Error('Your settings (config-noclaude.json) have a mistake in them, so they aren\'t valid JSON.'); }
  if (!c.openUrl && !c.openUrlTv) throw new Error('Your settings (config-noclaude.json) have no "openUrl".');
  return cfg = c;
}
async function getJson(url, post) {
  const r = await fetch('api/fetch?url=' + encodeURIComponent(url) +
    (post ? '&post=' + encodeURIComponent(JSON.stringify(post)) : ''), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ---------- IMDb (plain text fields only; images only from IMDb's image host) ----------
const IMDB_ID = /^tt\d{7,10}$/;
const txt = (s, n) => String(s ?? '').replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, n);
const imgUrl = u => (typeof u === 'string' && u.length < 500 && !/[\s"'<>()\\]/.test(u) &&
  (u.startsWith('https://m.media-amazon.com/') || u.startsWith('https://static.tvmaze.com/') || u.startsWith('https://commons.wikimedia.org/wiki/Special:FilePath/'))) ? u : '';
const TYPES = { feature: 'Movie', 'TV series': 'TV Series', 'TV mini-series': 'TV Mini Series', 'TV movie': 'TV Movie',
                'TV special': 'TV Special', short: 'Short', video: 'Video' };
const SKIP = new Set(['videoGame', 'podcastSeries', 'podcastEpisode', 'musicVideo']);
const GQL = 'https://caching.graphql.imdb.com/';

async function imdbSearch(q) {
  q = q.replace(/[\u0000-\u001f]/g, '').trim().toLowerCase().slice(0, 100);
  const d = await getJson(`https://v3.sg.media-imdb.com/suggestion/titles/x/${encodeURIComponent(q)}.json`);
  return (d.d || []).filter(x => IMDB_ID.test(String(x.id)) && !SKIP.has(x.qid)).slice(0, 10).map(x => ({
    id: x.id, title: txt(x.l, 200), year: txt(x.yr || x.y, 20), type: TYPES[x.q] || txt(x.q, 30),
    isTv: /TV (series|mini-series)/.test(String(x.q || '')), stars: txt(x.s, 200), poster: imgUrl((x.i || {}).imageUrl),
  }));
}

const TITLE_Q = `query($id: ID!) { title(id: $id) {
  titleText { text } titleType { text canHaveEpisodes } releaseYear { year endYear } runtime { seconds }
  certificate { rating } ratingsSummary { aggregateRating } plot { plotText { plainText } } primaryImage { url }
  genres { genres { text } } episodes { seasons { number } episodes(first: 0) { total } }
  credits(first: 15, filter: { categories: ["cast"] }) { edges { node {
    name { nameText { text } primaryImage { url } } ... on Cast { characters { name } } } } } } }`;

// TV shows: TVmaze (free public API, looks shows up by IMDb ID) gives seasons, episode names,
// cast and description. IMDb's own details service often refuses apps, so it's only a fallback.
const TVMAZE = 'https://api.tvmaze.com';
const plain = html => txt(new DOMParser().parseFromString(String(html || ''), 'text/html').body.textContent, 1000);
let maze = { id: null, show: null };
async function mazeShow(id) {
  if (maze.id !== id) {
    const s = await getJson(`${TVMAZE}/lookup/shows?imdb=${id}`);
    if (!Number.isInteger(s.id)) throw new Error('not on TVmaze');
    maze = { id, show: await getJson(`${TVMAZE}/shows/${s.id}?embed[]=episodes&embed[]=cast`) };
  }
  return maze.show;
}
async function mazeTitle(id) {
  const s = await mazeShow(id), emb = s._embedded || {}, eps = emb.episodes || [];
  const seasonNumbers = [...new Set(eps.map(e => e.season).filter(n => Number.isInteger(n) && n > 0 && n < 1000))].sort((a, b) => a - b);
  return {
    id, title: txt(s.name, 200), type: 'TV Series', isTv: true,   // year: keep IMDb's
    seasons: seasonNumbers.length, seasonNumbers, episodes: eps.length || null,
    runtime: (s.averageRuntime || s.runtime) ? (s.averageRuntime || s.runtime) * 60 : null,
    rating: (s.rating || {}).average, plot: plain(s.summary), poster: imgUrl((s.image || {}).original),
    genres: (s.genres || []).map(g => txt(g, 30)).slice(0, 5),
    cast: (emb.cast || []).slice(0, 15).map(c => ({
      name: txt((c.person || {}).name, 100), character: txt((c.character || {}).name, 100),
      photo: imgUrl(((c.person || {}).image || {}).medium),
    })).filter(c => c.name),
  };
}
async function mazeEpisodes(id, season) {
  const s = await mazeShow(id);
  return ((s._embedded || {}).episodes || []).filter(e => e.season === season && Number.isInteger(e.number))
    .map(e => ({ episode: e.number, title: txt(e.name, 120), summary: plain(e.summary).slice(0, 700),
                 airdate: txt(e.airdate, 10), runtime: Number.isFinite(e.runtime) ? e.runtime : null }));
}

// Movies: Wikidata (cast with photos, director, genres, runtime) + Wikipedia's summary as the
// description. Free, public, no keys; the app allows these hosts via videos.json (live).
const WD = 'https://query.wikidata.org/sparql?format=json&query=';
const timed = (url, ms) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { cache: 'force-cache', signal: c.signal }).finally(() => clearTimeout(t)); };
const wdRows = async q => ((await (await timed(WD + encodeURIComponent(q), 12000)).json()).results || {}).bindings || [];
const wdText = (b, k) => txt(b[k] && b[k].value, 200);
const GENRE_SKIP = /^(film|feature film|television series|drama)$/i;
async function wikiTitle(id) {
  if (!IMDB_ID.test(id)) throw new Error('bad id');
  const [info, cast] = await Promise.all([
    wdRows(`SELECT ?article ?dur (GROUP_CONCAT(DISTINCT ?dl; separator="|") AS ?dirs) (GROUP_CONCAT(DISTINCT ?gl; separator="|") AS ?genres) WHERE {
      ?item wdt:P345 "${id}". OPTIONAL { ?article schema:about ?item; schema:isPartOf <https://en.wikipedia.org/> }
      OPTIONAL { ?item wdt:P2047 ?dur } OPTIONAL { ?item wdt:P57 ?d. ?d rdfs:label ?dl FILTER(LANG(?dl)="en") }
      OPTIONAL { ?item wdt:P136 ?g. ?g rdfs:label ?gl FILTER(LANG(?gl)="en") } } GROUP BY ?article ?dur LIMIT 1`),
    wdRows(`SELECT ?actor ?name ?img ?role ?role2 WHERE { ?item wdt:P345 "${id}"; p:P161 ?st. ?st ps:P161 ?actor.
      ?actor rdfs:label ?name FILTER(LANG(?name)="en") OPTIONAL { ?actor wdt:P18 ?img }
      OPTIONAL { ?st pq:P453 ?c. ?c rdfs:label ?role FILTER(LANG(?role)="en") } OPTIONAL { ?st pq:P4633 ?role2 } } LIMIT 60`),
  ]);
  const i = info[0] || {};
  const seen = new Set(), people = [];
  for (const b of cast) {
    const name = wdText(b, 'name');
    if (!name || seen.has(name)) continue;
    seen.add(name);
    const file = b.img && /Special:FilePath\/(.+)$/.exec(b.img.value);

// ---------- TV shows: which episodes you opened (✓) and the one up next ----------

  }
  if (k === 'Enter') {
    if (cur.item) openDetail(cur.item);
    else if (cur.genre && ri < rows.length - 1) focusRow(rows[ri + 1]);
    return true;
  }
  return false;
}

// ---------- IMDb search ----------
function showHome(on) {
  homeEl.classList.toggle('hide', !on);
  $('hint').classList.toggle('hide', on);
  if (on) { results = []; resultsEl.textContent = ''; renderHome(); }
}
function openSearch() {
  show('search');
  if (!video.paused) video.pause();
  if (!q.value.trim()) showHome(true);
  q.focus();
  $('search').scrollTop = 0;
}

q.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const text = q.value.trim();
  if (!text) { searchToken++; showHome(true); return; }
  showHome(false);
  searchTimer = setTimeout(() => runSearch(text), 250);
});

async function runSearch(text) {
  const token = ++searchToken;
  try {
    const found = await imdbSearch(text);
    if (token !== searchToken) return;
    results = found;
    renderResults(`No titles found for “${text}”.`);
  } catch (e) {
    if (token === searchToken) { results = []; renderResults('Search failed. Check the TV’s internet connection and try again.'); }
  }
}

function renderResults(emptyText) {
  resultsEl.textContent = '';
  if (!results.length && emptyText && q.value.trim()) { resultsEl.append(el('li', 'm', emptyText)); return; }
  if (!q.value.trim() && results.length) resultsEl.append(el('li', 'head', '★ Favorites'));
  results.forEach((r, i) => {
    const li = el('li');
    li.tabIndex = 0;
    li.dataset.i = i;
    const p = img(r.poster, 80);
    if (p) { const im = el('img'); im.src = p; im.alt = ''; li.append(im); } else li.append(el('div', 'ph'));
    const box = el('div');
    const t = el('div', 't', r.title);
    if (isFav(r.id)) t.prepend(el('span', 'fav', '★ '));
    box.append(t, el('div', 'm', [r.year, r.type, r.stars].filter(Boolean).join(' · ')));
    li.append(box);
    resultsEl.append(li);
  });
}

// ---------- details ----------
function fmtRuntime(s) { return !s ? '' : s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.round(s % 3600 / 60)}m` : `${Math.round(s / 60)}m`; }

function renderDetail(d) {
  const p = img(d.poster, 600);
  $('poster').src = p || '';
  $('poster').style.visibility = p ? 'visible' : 'hidden';
  $('dtitle').textContent = d.title;
  const meta = $('dmeta'); meta.textContent = '';
  [d.year, d.type, d.certificate, fmtRuntime(d.runtime)].filter(Boolean).forEach(x => meta.append(el('span', '', x)));
  if (d.rating) meta.append(el('span', 'rating', `★ ${d.rating}/10`));
  meta.append(el('span', 'id', d.id));
  const pills = $('dpills'); pills.textContent = '';
  if (d.isTv && d.seasons) pills.append(el('span', 'pill tv', `${d.seasons} season${d.seasons === 1 ? '' : 's'}`));
  if (d.isTv && d.episodes) pills.append(el('span', 'pill tv', `${d.episodes} episodes`));
  (d.genres || []).forEach(g => pills.append(el('span', 'pill', g)));
  $('dplot').textContent = d.plot || (d.loading ? 'Loading details…' : '');
  $('dsub').textContent = (d.directors || []).length ? 'Directed by ' + d.directors.join(', ') : '';
  // Cast: a row of photos (◀ ▶ to scroll). Keeps your place when details arrive.
  const cast = $('cast'), had = cast.contains(document.activeElement) ? document.activeElement.dataset.i : null;
  cast.textContent = '';
  orderCast(d.cast || [], d.stars).slice(0, 30).forEach((c, i) => {
    const a = el('div', 'person');
    a.tabIndex = 0; a.dataset.i = i;
    const ph = img(c.photo, 160);
    if (ph) { const im = el('img', 'pp'); im.src = ph; im.alt = ''; im.loading = 'lazy'; im.onerror = () => im.removeAttribute('src'); a.append(im); }
    else { const ini = el('div', 'pp'); ini.textContent = ''; a.append(ini); }
    a.append(el('div', 'n', c.name));
    if (c.character) a.append(el('div', 'c', c.character));
    cast.append(a);
  });
  if (had != null && cast.children[had]) cast.children[had].focus({ preventScroll: true });
  $('dcastwrap').classList.toggle('hide', !(d.cast || []).length);
  renderMore(d);
  $('epick').classList.toggle('hide', !d.isTv);
  if (d.isTv) renderPick();
  renderFav();
}

// ---------- TV shows: season + episode picker ----------
const range = n => Array.from({ length: n }, (_, i) => i + 1);
function seasonOptions() {
  if (current && current.seasonNumbers && current.seasonNumbers.length) return current.seasonNumbers;
  return range(current && current.seasons ? current.seasons : 30);
}
function episodeOptions() { return pick.episodes && pick.episodes.length ? pick.episodes.map(e => e.episode) : range(60); }
function renderPick() {
  $('vSeason').textContent = pick.season;
  $('vEpisode').textContent = pick.episode;
  const ep = (pick.episodes || []).find(e => e.episode === pick.episode);
  $('eptitle').textContent = ep && ep.title ? ep.title : '';
  const p = current && progress[current.id], mark = $('epmark');
  const isSeen = !!current && seen(current.id, pick.season, pick.episode);
  const isNext = !!p && p.ns === pick.season && p.ne === pick.episode && !isSeen;
  mark.textContent = isSeen ? '✓ Watched' : isNext ? '▶ Up next' : '';
  mark.classList.toggle('seen', isSeen);
  // About this episode: name, date, length and what happens.
  const info = $('epinfo');
  info.classList.toggle('hide', !(ep && (ep.summary || ep.airdate)));
  if (ep) {
    info.querySelector('.eh').textContent = `S${pick.season} E${pick.episode}${ep.title ? ' · ' + ep.title : ''}`;
    const date = ep.airdate ? new Date(ep.airdate + 'T12:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
    info.querySelector('.em').textContent = [date, ep.runtime ? ep.runtime + 'm' : ''].filter(Boolean).join(' · ');
    info.querySelector('.es').textContent = ep.summary || '';
  }
}

// ---------- More like this: from the genre rows (browse.json) ----------
const GENRE_ROWS = [[/comedy|sitcom/i, 'comedy'], [/action|adventure|superhero|war|western/i, 'action'], [/crime|police|gangster|heist/i, 'crime'],
  [/thriller|mystery|suspense|spy|detective/i, 'thriller'], [/horror|supernatural/i, 'horror'], [/science|sci-fi|fantasy/i, 'scifi'],
  [/romance|romantic/i, 'romance'], [/animat|family|children|kids/i, 'family'], [/christmas|holiday/i, 'christmas']];
function moreLike(d) {
  const rows = browse.filter(r => r.items.some(x => x.id === d.id));
  for (const g of d.genres || []) for (const [re, id] of GENRE_ROWS) if (re.test(g)) { const r = browse.find(x => x.id === id); if (r && !rows.includes(r)) rows.push(r); }
  const seenIds = new Set([d.id]), same = [], other = [];
  for (const r of rows) for (const x of r.items) {
    if (seenIds.has(x.id)) continue;
    seenIds.add(x.id);
    (x.isTv === !!d.isTv ? same : other).push(x);   // movies for a movie, shows for a show first
  }
  return [...same, ...other].slice(0, 24);
}
function renderMore(d) {
  const row = $('more'), had = row.contains(document.activeElement) ? document.activeElement.item && document.activeElement.item.id : null;
  const items = moreLike(d);
  if (row.dataset.for === d.id && row.children.length === items.length) return;   // unchanged: keep your place
  row.dataset.for = d.id;
  row.textContent = '';
  items.forEach(x => row.append(card(x)));
  if (had) { const c = [...row.children].find(c => c.item.id === had); if (c) c.focus({ preventScroll: true }); }
  $('dmorewrap').classList.toggle('hide', !items.length);
}
async function loadEpisodes() {
  const token = ++pick.token, id = current.id, season = pick.season;
  pick.episodes = null;
  renderPick();
  try {
    const eps = await imdbEpisodes(id, season);
    if (token !== pick.token) return;
    pick.episodes = eps.length ? eps : null;
    const opts = episodeOptions();
    if (!opts.includes(pick.episode)) pick.episode = opts[0];
    renderPick();
  } catch (e) { /* no names: plain numbers still work */ }
}
function step(list, value, dir) {
  const i = list.indexOf(value);
  return list[Math.max(0, Math.min(list.length - 1, (i < 0 ? 0 : i + dir)))];
}
function changePick(which, dir) {
  if (which === 'season') {
    const next = step(seasonOptions(), pick.season, dir);
    if (next === pick.season) return;
    pick.season = next; pick.episode = 1; loadEpisodes();
  } else {
    pick.episode = step(episodeOptions(), pick.episode, dir);
  }
  renderPick();
}

let detailStack = [];   // titles opened from "More like this": Back returns to them
async function openDetail(r, fromMore) {
  if (fromMore && current) detailStack.push({ item: current, pick: { ...pick } }); else if (!fromMore) detailStack = [];
  $('detail').scrollTop = 0;
  const same = current && current.id === r.id;
  current = { ...r, cast: r.cast || (r.stars || '').split(',').map(n => ({ name: n.trim() })).filter(c => c.name) };
  if (!same) {
    const pr = r.isTv && progress[r.id];
    pick = { season: pr ? pr.ns : 1, episode: pr ? pr.ne : 1, episodes: null, token: pick.token + 1 };
    if (r.isTv) loadEpisodes();
  }
  renderDetail({ ...current, loading: !current.plot });
  show('detail');
  (current.isTv && !same ? $('selSeason') : $('openBtn')).focus();
  if (current.plot) return;
  const id = r.id;
  try {
    const full = await imdbTitle(id, !!r.isTv);
    if (current && current.id === id) {
      current = { ...current, ...Object.fromEntries(Object.entries(full).filter(([, v]) =>
        v !== '' && v != null && !(Array.isArray(v) && !v.length))) };
      if (current.isTv && !seasonOptions().includes(pick.season)) { pick.season = seasonOptions()[0]; pick.episode = 1; loadEpisodes(); }
      renderDetail(current);
    } else if (current && current.id === id) renderDetail(current);
  } catch (e) { if (current && current.id === id) renderDetail(current); }
}

// ---------- Open: scrape on the computer, then buffer at top quality, then play ----------
function loader(status, pct) {
  $('lstatus').textContent = status;
  $('lpct').textContent = pct == null ? '' : `${pct}%`;
  $('lfill').style.width = `${pct || 0}%`;
}

async function openVideo() {
  if (!current) return;
  const tv = !!current.isTv;
  const t = { ...current, label: tv ? `${current.title} · S${pick.season} E${pick.episode}` : current.title };
  if (tv) { recordProgress(current, pick.season, pick.episode); renderPick(); }
  const token = ++openToken;
  stopVideo();
  $('ltitle').textContent = t.label;
  loader('Opening the website: start the video there (◀▲▼▶ move, OK click, Back cancel)…', null);
  show('loader');
  let d;
  const season = pick.season, episode = pick.episode;
  for (;;) {
    const since = Date.now();
    try { d = await openStream(t, season, episode); }
    catch (e) { d = { error: (e && e.message) || 'Could not reach the video site.' }; }
    if (token !== openToken) return;
    // Older app versions close the website by themselves after 15 minutes, even while a video
    // plays inside it. If that's what happened (not Back), open the website again right away.
    const timedOut = !safeVideos(d).length && d && /No video was started/.test(d.error || '')
      && Date.now() - since > 14 * 60 * 1000;
    if (!timedOut) break;
    loader('Reopening the website…', null);
  }
  const list = safeVideos(d);
  if (!list.length) { loader((d && typeof d.error === 'string' && d.error.slice(0, 200)) || 'No playable video found for this title.', null); return; }
  const item = list[0];
  opened = t;
  loader(`Loading ${item.quality || 'best'} quality…`, 0);
  const startAt = resumeAt && resumeAt.label === t.label ? resumeAt.time : 0;
  resumeAt = null; recoverTimes = [];
  if (startAt) loader(`Loading ${item.quality || 'best'} quality… (continuing at ${Math.floor(startAt / 60)}:${String(Math.floor(startAt % 60)).padStart(2, '0')})`, 0);
  attach(item.src, startAt);
  video.onerror = () => { if (token === openToken && screen === 'loader') loader('The video failed to load.', null); };

  // Wait until BUFFER_SECONDS of video (or the whole thing, if shorter) is loaded, showing %.
  const started = Date.now();
  let last = 0, lastChange = Date.now();
  bufferTimer = setInterval(() => {
    if (token !== openToken) return clearInterval(bufferTimer);
    let ahead = 0;
    for (let i = 0; i < video.buffered.length; i++)
      if (video.buffered.start(i) <= video.currentTime + 0.5) ahead = Math.max(ahead, video.buffered.end(i) - video.currentTime);
    const dur = isFinite(video.duration) ? video.duration : Infinity;
    const target = Math.max(1, Math.min(BUFFER_SECONDS, dur - video.currentTime - 0.5));
    const pct = Math.min(100, Math.floor(ahead / target * 100));
    if (pct !== last) { last = pct; lastChange = Date.now(); }
    if (pct >= 100) {
      clearInterval(bufferTimer);
      startPlayback(t, item);
    } else if (Date.now() - lastChange > 60000) {
      clearInterval(bufferTimer); stopVideo(); loader('The video stopped loading. Try again.', null);
    } else loader(`Loading ${item.quality || 'best'} quality…${Date.now() - started > 15000 && pct < 5 ? ' (slow connection)' : ''}`, pct);
  }, 250);
}

function startPlayback(t, item) {
  show('player');
  msg.style.display = 'none';
  $('title').textContent = t.label || t.title;
  const ep = t.isTv && (pick.episodes || []).find(e => e.episode === pick.episode);
  $('desc').textContent = ep && ep.title ? ep.title : '';
  $('meta').textContent = `${item.quality ? item.quality + '  ·  ' : ''}OK pause/play  ·  ◀ ▶ skip 10s  ·  Back details  ·  ▲ search`;
  video.play().catch(() => {});
  showInfo();
}

// ---------- remote control ----------
function focusResult(i) { const li = resultsEl.querySelectorAll('li[tabindex]')[i]; if (li) li.focus(); return !!li; }

document.addEventListener('keydown', e => {
  const k = e.key;
  if (screen === 'search') {
    const li = document.activeElement.closest && document.activeElement.closest('#results li[tabindex]');
    const h = document.activeElement.closest && document.activeElement.closest('#home [tabindex]');
    if (h) { if (homeKey(k, h)) e.preventDefault(); return; }
    if (document.activeElement === q) {
      if (k === 'ArrowDown' && !q.value.trim()) { const r = homeRows()[0]; if (r) { focusRow(r); e.preventDefault(); } }
      else if (k === 'ArrowDown') { if (focusResult(0)) e.preventDefault(); }
      else if (k === 'Enter') { e.preventDefault(); if (results.length) openDetail(results[0]); else runSearch(q.value.trim()); }
      else if (k === 'Escape') closeOverlay();
      return; // other keys type into the box
    }
    if (li) {
      const i = +li.dataset.i;
      if (k === 'ArrowDown') focusResult(i + 1);
      else if (k === 'ArrowUp') { if (!focusResult(i - 1)) q.focus(); }
      else if (k === 'Enter') openDetail(results[i]);
      else return;
      e.preventDefault();
    } else q.focus();
    return;
  }
  if (screen === 'detail') {
    const order = current && current.isTv ? [$('favBtn'), $('selSeason'), $('selEpisode'), $('openBtn')] : [$('favBtn'), $('openBtn')];
    const drows = [...$('detail').querySelectorAll('.drow')].filter(r => !r.parentNode.classList.contains('hide') && r.querySelector('[tabindex]'));
    const inRow = document.activeElement.closest && document.activeElement.closest('.drow');
    if (inRow) {                                       // cast / more-like-this rows
      const items = [...inRow.querySelectorAll('[tabindex]')], j = items.indexOf(document.activeElement), ri = drows.indexOf(inRow);
      if (k === 'ArrowLeft') { if (j > 0) focusIn(items[j - 1]); }
      else if (k === 'ArrowRight') { if (j < items.length - 1) focusIn(items[j + 1]); }
      else if (k === 'ArrowUp') { if (ri > 0) focusRow(drows[ri - 1], document.activeElement); else { order[order.length - 1].focus(); $('detail').scrollTop = 0; } }
      else if (k === 'ArrowDown') { if (ri < drows.length - 1) focusRow(drows[ri + 1], document.activeElement); }
      else if (k === 'Enter') { if (document.activeElement.item) openDetail(document.activeElement.item, true); }
      else return;
      e.preventDefault();
      return;
    }
    if (k === 'ArrowDown' && document.activeElement === order[order.length - 1] && drows.length) { focusRow(drows[0]); e.preventDefault(); return; }
    let i = order.indexOf(document.activeElement);
    if (i < 0) { order[order.length - 1].focus(); i = order.length - 1; }
    const f = order[i];
    if (k === 'ArrowDown') order[Math.min(i + 1, order.length - 1)].focus();
    else if (k === 'ArrowUp') order[Math.max(i - 1, 0)].focus();
    else if ((k === 'ArrowLeft' || k === 'ArrowRight') && (f.id === 'selSeason' || f.id === 'selEpisode'))
      changePick(f.id === 'selSeason' ? 'season' : 'episode', k === 'ArrowRight' ? 1 : -1);
    else if (k === 'Enter') { if (f.id === 'openBtn') openVideo(); else if (f.id === 'favBtn') toggleFav(); else order[i + 1].focus(); }
    else return;
    e.preventDefault();
    return;
  }
  if (screen === 'loader') return;
  // player
  if (k === 'ArrowUp') { e.preventDefault(); openSearch(); return; }
  if (opened) {
    if (k === 'ArrowRight') video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 10);
    else if (k === 'ArrowLeft') video.currentTime = Math.max(0, video.currentTime - 10);
    else if (k === 'Enter' || k === ' ' || k === 'MediaPlayPause') video.paused ? video.play() : video.pause();
    else return showInfo();
    showInfo(); e.preventDefault(); return;
  }
  if (!videos.length) return;
  if (k === 'ArrowRight') play(index + 1);
  else if (k === 'ArrowLeft') play(index - 1);
  else if (k === 'Enter' || k === ' ' || k === 'MediaPlayPause') video.paused ? video.play() : video.pause();
  else { showInfo(); return; }
  e.preventDefault();
});

function closeOverlay() {
  q.blur();
  show('player');
  if (video.currentSrc && video.paused) video.play().catch(() => {});
  if (!video.currentSrc) { msg.style.display = 'flex'; msg.textContent = 'Press ▲ on the remote to search.'; }
}

// Called by the TV app when Back is pressed. Return true = handled, false = exit the app.
window.onTvBack = () => {
  if (screen === 'loader') { openToken++; stopVideo(); opened = null; show('detail'); $('openBtn').focus(); return true; }
  if (screen === 'detail' && detailStack.length) {   // back to the title you came from
    const prev = detailStack.pop();
    current = null;
    openDetail(prev.item, 'back');
    pick = { ...prev.pick, token: pick.token + 1 };
    if (prev.item.isTv) loadEpisodes();
    renderPick();
    return true;
  }
  if (screen === 'detail') {
    show('search');
    if (!q.value.trim()) {                  // home: refresh (favorites / up next may have changed), same spot
      const at = lastHomeFocus, id = at && at.item && at.item.id, inGenre = at && at.closest && at.closest('.genre');
      const title = at && at.closest && at.closest('.row') && at.closest('.row').previousElementSibling;
      const which = title && title.classList.contains('rowt') ? title.textContent : null;
      showHome(true);
      let back = null;
      if (id) {
        const rows = [...homeEl.querySelectorAll(inGenre ? '.genre' : '.row')].filter(r =>
          inGenre || (r.previousElementSibling && r.previousElementSibling.textContent === which));
        back = rows.map(r => [...r.querySelectorAll('.card')].find(c => c.item.id === id)).find(Boolean);
      }
      if (back) focusIn(back); else { const r = homeRows()[0]; if (r) focusRow(r); else q.focus(); }
      return true;
    }
    const i = results.findIndex(r => current && r.id === current.id); if (!focusResult(i)) q.focus(); return true;
  }
  if (screen === 'search') { closeOverlay(); return true; }
  if (opened) { video.pause(); openDetail(opened); return true; }
  return false;
};

// ---------- start: default video list if there is one, otherwise straight to search ----------
loadFavs().then(loadProgress).then(() => { if (screen === 'search' && !q.value.trim() && !homeEl.contains(document.activeElement)) renderHome(); });
fetch('videos.json?t=' + Date.now(), { cache: 'no-store' })
  .then(r => r.json())
  .then(d => { videos = safeVideos(d); if (!videos.length) throw new Error('no videos'); play(0); })
  .catch(() => openSearch());
</script>
