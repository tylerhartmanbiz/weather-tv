name: Home screen rows
# Rebuilds docs/browse.json (Trending, Christmas, genres) every day. The TV reads it live.
on:
  schedule:
    - cron: "23 10 * * *"
  push:
    branches: [main]
    paths: ["browse.py", ".github/workflows/browse.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: browse, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -I -B browse.py docs/browse.json
      - name: Commit if changed
        run: |
          git diff --quiet docs/browse.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update home screen rows" docs/browse.json
          git pull --rebase -q origin main && git push
